<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Samstasteedelight — 9 Mobile-Optimized Prototypes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cocoa: {
              950: '#120904',
              900: '#1C0E07',
              800: '#2C1A11',
              700: '#472B1E',
            },
            cream: {
              50: '#FDFBF7',
              100: '#FAF3E0',
              200: '#F1E3C5',
            },
            gold: '#D4AF37',
            terracotta: '#C86D51'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-cocoa-950 text-cream-50 font-sans antialiased min-h-screen flex flex-col">

  <!-- TOP HUB HEADER -->
  <header class="bg-cocoa-900 border-b border-gold/20 px-3 sm:px-6 py-3 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 sm:gap-4">
      
      <!-- BRAND LOGO -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-gold text-cocoa-950 flex items-center justify-center font-serif font-bold text-base sm:text-xl shadow">
          S
        </div>
        <div>
          <h1 class="font-serif text-base sm:text-xl font-bold text-cream-50 leading-tight">Samstasteedelight</h1>
          <span class="text-[9px] sm:text-[10px] uppercase tracking-[0.2em] text-gold block">9 Mobile-Ready Prototypes</span>
        </div>
      </div>

      <!-- VIEWPORT TOGGLES -->
      <div class="flex items-center gap-1 bg-cocoa-950 p-1 rounded-lg border border-gold/20 text-xs">
        <button id="btnDesktop" onclick="setViewport('100%')" class="px-2.5 py-1 rounded bg-gold text-cocoa-950 font-bold flex items-center gap-1 transition-all text-[11px] sm:text-xs">
          <i data-lucide="monitor" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i> <span class="hidden xs:inline">Desktop</span>
        </button>
        <button id="btnTablet" onclick="setViewport('768px')" class="px-2.5 py-1 rounded text-cream-200 hover:text-white flex items-center gap-1 transition-all text-[11px] sm:text-xs">
          <i data-lucide="tablet" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i> <span class="hidden xs:inline">Tablet</span>
        </button>
        <button id="btnMobile" onclick="setViewport('390px')" class="px-2.5 py-1 rounded text-cream-200 hover:text-white flex items-center gap-1 transition-all text-[11px] sm:text-xs">
          <i data-lucide="smartphone" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i> <span>Mobile</span>
        </button>
      </div>

      <!-- ACTION BUTTON -->
      <div class="hidden sm:flex items-center">
        <a id="openDirectBtn" href="sample1-artisanal-luxury.html" target="_blank" class="bg-cream-100 hover:bg-white text-cocoa-950 px-3.5 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 shadow transition-colors">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Fullscreen
        </a>
      </div>

    </div>
  </header>

  <!-- SAMPLE SELECTOR BAR -->
  <nav class="bg-cocoa-900 border-b border-gold/15 px-2 sm:px-4 py-2 overflow-x-auto no-scrollbar">
    <div class="max-w-7xl mx-auto flex items-center gap-1.5 sm:gap-2 min-w-max">
      
      <button onclick="loadSample('sample1-artisanal-luxury.html', this)" class="sample-tab active bg-gold text-cocoa-950 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold transition-all">
        <span>01. Artisanal Luxury</span>
      </button>

      <button onclick="loadSample('sample2-modern-vibrant.html', this)" class="sample-tab bg-cocoa-800 text-cream-200 hover:text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold/20 transition-all">
        <span>02. Box Builder</span>
      </button>

      <button onclick="loadSample('sample3-boutique-craft.html', this)" class="sample-tab bg-cocoa-800 text-cream-200 hover:text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold/20 transition-all">
        <span>03. Editorial Craft</span>
      </button>

      <button onclick="loadSample('sample4-celebration-event.html', this)" class="sample-tab bg-cocoa-800 text-cream-200 hover:text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold/20 transition-all">
        <span>04. Event Spec Generator</span>
      </button>

      <button onclick="loadSample('sample5-minimalist-showcase.html', this)" class="sample-tab bg-cocoa-800 text-cream-200 hover:text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold/20 transition-all">
        <span>05. Product Minimalist</span>
      </button>

      <button onclick="loadSample('sample6-vintage-heritage.html', this)" class="sample-tab bg-cocoa-800 text-cream-200 hover:text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold/20 transition-all">
        <span>06. Vintage Heritage</span>
      </button>

      <button onclick="loadSample('sample7-luxury-gifting.html', this)" class="sample-tab bg-cocoa-800 text-cream-200 hover:text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold/20 transition-all">
        <span>07. Corporate Catering</span>
      </button>

      <button onclick="loadSample('sample8-flavor-pairing.html', this)" class="sample-tab bg-cocoa-800 text-cream-200 hover:text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold/20 transition-all">
        <span>08. Flavor Studio</span>
      </button>

      <button onclick="loadSample('sample9-moody-dark-cocoa.html', this)" class="sample-tab bg-cocoa-800 text-cream-200 hover:text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold/20 transition-all">
        <span>09. Midnight Speakeasy</span>
      </button>

    </div>
  </nav>

  <!-- LIVE PREVIEW CANVAS -->
  <main class="flex-1 bg-cocoa-950 p-2 sm:p-6 flex items-center justify-center overflow-hidden">
    <div id="previewFrameContainer" class="w-full h-[calc(100vh-120px)] sm:h-[calc(100vh-140px)] max-w-full transition-all duration-300 rounded-xl sm:rounded-2xl overflow-hidden shadow-2xl border border-gold/30 bg-white">
      <iframe id="sampleIframe" src="sample1-artisanal-luxury.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function loadSample(url, btn) {
      document.getElementById('sampleIframe').src = url;
      document.getElementById('openDirectBtn').href = url;

      document.querySelectorAll('.sample-tab').forEach(t => {
        t.className = "sample-tab bg-cocoa-800 text-cream-200 hover:text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold/20 transition-all";
      });

      btn.className = "sample-tab active bg-gold text-cocoa-950 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 border border-gold transition-all";
    }

    function setViewport(width) {
      const frame = document.getElementById('previewFrameContainer');
      frame.style.width = width;

      const btns = {
        '100%': 'btnDesktop',
        '768px': 'btnTablet',
        '390px': 'btnMobile'
      };

      Object.keys(btns).forEach(w => {
        const btn = document.getElementById(btns[w]);
        if (w === width) {
          btn.className = "px-2.5 py-1 rounded bg-gold text-cocoa-950 font-bold flex items-center gap-1 transition-all text-[11px] sm:text-xs";
        } else {
          btn.className = "px-2.5 py-1 rounded text-cream-200 hover:text-white flex items-center gap-1 transition-all text-[11px] sm:text-xs";
        }
      });
    }
  </script>
</body>
</html>
